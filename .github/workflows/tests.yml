name: tests

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install canonical release dependencies
        run: |
          python -m pip install "torch==2.4.0" --index-url https://download.pytorch.org/whl/cu124
          python -m pip install -e ".[test]"
      - name: Record reproducibility environment
        shell: bash
        run: |
          python --version
          python - <<'PY'
          import platform

          import numpy
          import pytest
          import scipy
          import sklearn
          import torch

          print("platform=", platform.platform())
          print("python=", platform.python_version())
          print("torch=", torch.__version__)
          print("numpy=", numpy.__version__)
          print("scipy=", scipy.__version__)
          print("sklearn=", sklearn.__version__)
          print("pytest=", pytest.__version__)
          print("torch_threads=", torch.get_num_threads())
          print(torch.__config__.show())
          PY
          if command -v lscpu >/dev/null 2>&1; then
            lscpu
          fi
      - name: Run full test suite
        run: python -m pytest -q
      - name: Validate F2 parity
        run: python scripts/validate_f2_parity.py

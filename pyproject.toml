[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coregad"
version = "0.2.0"
description = "Normal-calibrated factorized graph evidence routing for normal-only anomaly detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["coregad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
